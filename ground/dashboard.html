<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CanSat Mission Control</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--ink:#14222b;--muted:#667780;--paper:#edf2ed;--panel:#f8faf7;--line:#cbd5cf;--sky:#2b94c8;--sun:#f2a640;--good:#16836a;--bad:#d85b49}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',sans-serif}.shell{max-width:1200px;margin:auto;padding:28px}.mast{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:22px}.eyebrow,.label{font:500 11px 'DM Mono';letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(36px,7vw,76px);line-height:.84;letter-spacing:-.075em;margin:12px 0 0}.status{padding:9px 12px;background:var(--ink);color:#fff;font:12px 'DM Mono'}.drop{margin:28px 0;padding:23px;border:1.5px dashed var(--muted);background:rgba(255,255,255,.34);display:flex;gap:16px;align-items:center}.drop b{font-size:17px}.drop input{margin-left:auto}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);padding:20px;box-shadow:5px 5px 0 rgba(20,34,43,.08)}.wide{grid-column:1/-1}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.metric{background:var(--panel);padding:20px}.metric strong{display:block;font:500 clamp(26px,4vw,44px) 'DM Mono';letter-spacing:-.08em;margin-top:7px}.event{padding:11px 0;border-bottom:1px solid var(--line);font:13px 'DM Mono'}canvas{width:100%;height:270px;background:#f1f6f1}.hint{color:var(--muted);font-size:14px}@media(max-width:700px){.shell{padding:17px}.grid{grid-template-columns:1fr}.drop{display:block}.drop input{margin:14px 0 0}.mast{gap:12px}.status{white-space:nowrap}}
</style><body><main class="shell"><header class="mast"><div><div class="eyebrow">CanSat / Ground station</div><h1>Mission<br>control.</h1></div><div class="status" id="status">NO TELEMETRY</div></header><label class="drop" id="drop"><div><b>Load a flight log</b><div class="hint">Drop a CSV from the ground dashboard, or choose a file.</div></div><input id="file" type="file" accept=".csv,text/csv"></label><section class="grid"><div class="panel wide"><div class="label">Altitude profile / metres</div><canvas id="chart" width="1100" height="300"></canvas></div><div class="metrics"><div class="metric"><div class="label">Mission state</div><strong id="state">—</strong></div><div class="metric"><div class="label">Relative altitude</div><strong id="alt">—</strong></div><div class="metric"><div class="label">Temperature</div><strong id="temp">—</strong></div><div class="metric"><div class="label">Pressure</div><strong id="pressure">—</strong></div></div><div class="panel"><div class="label">Mission events</div><div id="events" class="hint">Load a log to inspect its timeline.</div></div></section></main><script>
const $=id=>document.getElementById(id),states=['BOOT','PREFLIGHT','READY','ASCENT','DESCENT','LANDED','RECOVERY'],events=['','BOOTED','READY','ASCENT','DESCENT','LANDED','RECOVERY','COMMAND'];let rows=[];
function load(text){let [head,...lines]=text.trim().split(/\r?\n/),keys=head.split(',');rows=lines.map(l=>Object.fromEntries(keys.map((k,i)=>[k,Number(l.split(',')[i])]))).filter(r=>r.ms===r.ms);render()}
function render(){if(!rows.length)return;let r=rows.at(-1),m=n=>Number(n).toFixed(2);let missed=rows.slice(1).reduce((n,x,i)=>n+((x.seq-rows[i].seq-1+256)%256),0),sensorFaults=rows.filter(x=>!(x.flags&1)).length,txFaults=rows.filter(x=>x.flags&2).length;$('status').textContent=(missed||sensorFaults||txFaults?'FAULT / ':'LINKED / ')+rows.length+' PACKETS'+(missed?' / '+missed+' MISSED':'')+(sensorFaults?' / '+sensorFaults+' BMP FAULTS':'')+(txFaults?' / '+txFaults+' TX FAULTS':'');$('status').style.background=missed||sensorFaults||txFaults?'var(--bad)':'var(--ink)';$('state').textContent=states[r.state]||'UNKNOWN';$('alt').textContent=m(r.relative_altitude_cm/100)+'m';$('temp').textContent=m(r.temp_centi_c/100)+'°C';$('pressure').textContent=r.flags&1?r.pressure_pa+' Pa':'—';$('events').innerHTML=rows.filter(x=>x.event).map(x=>`<div class="event">${(x.ms/1000).toFixed(1)}s &nbsp; ${events[x.event]||'EVENT'}</div>`).join('')||'<span class="hint">No state changes recorded.</span>';let c=$('chart'),x=c.getContext('2d'),w=c.width,h=c.height,max=Math.max(1,...rows.map(r=>r.relative_altitude_cm));x.clearRect(0,0,w,h);x.strokeStyle='#cbd5cf';for(let i=1;i<5;i++){let y=i*h/5;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}x.strokeStyle='#2b94c8';x.lineWidth=4;x.beginPath();rows.forEach((r,i)=>{let px=i*w/(rows.length-1),py=h-(r.relative_altitude_cm/max)*(h-22)-11;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
['dragover','drop'].forEach(e=>$('drop').addEventListener(e,x=>{x.preventDefault();if(e==='drop')read(x.dataTransfer.files[0])}));$('file').onchange=e=>read(e.target.files[0]);function read(f){if(!f)return;let r=new FileReader;r.onload=()=>load(r.result);r.readAsText(f)}
</script></body></html>
